    <script>
        const LiCAdmin = (function() {
            const CONFIG = {
                SITE_URL: 'https://learningischange.com',
                DATABASE_PATH: '/database',
                CACHE_DURATION: 5 * 60 * 1000,
                DATABASE_CACHE_KEY: 'lic_search_database'
            };
            
            let databaseCache = null;
            let databaseCacheTime = 0;
            
            async function fetchDatabase(forceRefresh = false) {
                const now = Date.now();
                if (!forceRefresh && databaseCache && (now - databaseCacheTime) < CONFIG.CACHE_DURATION) {
                    return databaseCache;
                }
                
                if (!forceRefresh) {
                    try {
                        const cached = localStorage.getItem(CONFIG.DATABASE_CACHE_KEY);
                        if (cached) {
                            const { data, timestamp } = JSON.parse(cached);
                            if ((now - timestamp) < CONFIG.CACHE_DURATION) {
                                databaseCache = data;
                                databaseCacheTime = timestamp;
                                return data;
                            }
                        }
                    } catch (e) {}
                }
                
                const baseUrl = CONFIG.SITE_URL + CONFIG.DATABASE_PATH;
                
                const manifestRes = await fetch(baseUrl + '/manifest.json');
                if (!manifestRes.ok) throw new Error('Failed to fetch manifest');
                const manifest = await manifestRes.json();
                
                let taxonomies = { categories: { items: {} }, tags: { items: {} } };
                try {
                    const taxRes = await fetch(baseUrl + '/taxonomies.json');
                    if (taxRes.ok) taxonomies = await taxRes.json();
                } catch (e) {}
                
                let pages = [];
                try {
                    const pagesRes = await fetch(baseUrl + '/pages.json');
                    if (pagesRes.ok) {
                        const pagesData = await pagesRes.json();
                        pages = pagesData.pages || [];
                    }
                } catch (e) {}
                
                const database = {
                    manifest,
                    taxonomies,
                    pages,
                    posts: {},
                    _shards: manifest.shards?.posts || {}
                };
                
                databaseCache = database;
                databaseCacheTime = now;
                
                try {
                    localStorage.setItem(CONFIG.DATABASE_CACHE_KEY, JSON.stringify({ data: database, timestamp: now }));
                } catch (e) {}
                
                return database;
            }
            
            async function fetchPostsByYear(year) {
                const baseUrl = CONFIG.SITE_URL + CONFIG.DATABASE_PATH;
                try {
                    const res = await fetch(baseUrl + '/posts/' + year + '.json');
                    if (!res.ok) return [];
                    const data = await res.json();
                    return data.posts || [];
                } catch (e) {
                    return [];
                }
            }
            
            function formatDate(dateString) {
                if (!dateString) return '';
                return new Date(dateString).toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            }
            
            function formatNumber(num) {
                return num.toLocaleString();
            }
            
            function decodeEntities(text) {
                if (!text) return '';
                const textarea = document.createElement('textarea');
                textarea.innerHTML = text;
                return fixMojibake(textarea.value);
            }
            
            // Fix common UTF-8 mojibake patterns (UTF-8 bytes interpreted as Latin-1)
            function fixMojibake(text) {
                if (!text) return '';
                return text
                    // Ellipsis
                    .replace(/â€¦/g, '...')
                    .replace(/â¦/g, '...')
                    // Curly quotes and apostrophes
                    .replace(/â€™/g, "'")
                    .replace(/â€˜/g, "'")
                    .replace(/â€œ/g, '"')
                    .replace(/â€/g, '"')
                    .replace(/Ã¢â‚¬â„¢/g, "'")
                    .replace(/â€"/g, '-')
                    // Em and en dashes
                    .replace(/â€"/g, '-')
                    .replace(/â€"/g, '-')
                    .replace(/â€"Â /g, '- ')
                    // Accented characters
                    .replace(/Ã©/g, 'e')
                    .replace(/Ã¨/g, 'e')
                    .replace(/Ã /g, 'a')
                    .replace(/Ã¢/g, 'a')
                    .replace(/Ã´/g, 'o')
                    .replace(/Ã®/g, 'i')
                    .replace(/Ã¯/g, 'i')
                    .replace(/Ã§/g, 'c')
                    .replace(/Ã±/g, 'n')
                    // Common fragments that indicate mojibake
                    .replace(/Â /g, ' ')
                    .replace(/Â·/g, '-')
                    .replace(/Ã¢â‚¬/g, '')
                    // Clean up any remaining weird patterns
                    .replace(/â€‹/g, '') // zero-width space
                    .replace(/Â»/g, '>>')
                    .replace(/Â«/g, '<<')
                    .replace(/Â®/g, '(R)')
                    .replace(/â„¢/g, '(TM)')
                    .replace(/Â©/g, '(c)');
            }
            
            return { CONFIG, fetchDatabase, fetchPostsByYear, formatDate, formatNumber, decodeEntities };
        })();
    </script>
    
    <script>
        let allPosts = [];
        let filteredResults = [];
        let currentPage = 1;
        const resultsPerPage = 20;
        let database = null;
        let isLoaded = false;
        
        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('s');
            if (query) {
                document.getElementById('searchInput').value = query;
            }
            
            await loadDatabase();
            
            if (query) {
                performSearch();
            }
        });
        
        async function loadDatabase() {
            try {
                database = await LiCAdmin.fetchDatabase();
                
                document.getElementById('statTotalPosts').textContent = LiCAdmin.formatNumber(database.manifest.stats.total_posts);
                document.getElementById('statTotalPages').textContent = LiCAdmin.formatNumber(database.manifest.stats.total_pages);
                
                const yearSelect = document.getElementById('filterYear');
                const years = Object.keys(database._shards).sort().reverse();
                years.forEach(function(year) {
                    const opt = document.createElement('option');
                    opt.value = year;
                    opt.textContent = year;
                    yearSelect.appendChild(opt);
                });
                
                const catSelect = document.getElementById('filterCategory');
                const categories = Object.values(database.taxonomies.categories?.items || {});
                categories.sort(function(a, b) { return a.name.localeCompare(b.name); });
                categories.forEach(function(cat) {
                    const opt = document.createElement('option');
                    opt.value = cat.slug;
                    opt.textContent = LiCAdmin.decodeEntities(cat.name);
                    catSelect.appendChild(opt);
                });
                
                displayTopCategories(categories);
                
                const tags = Object.values(database.taxonomies.tags?.items || {});
                displayTopTags(tags);
                
                await loadAllPosts();
                
                isLoaded = true;
                
                document.getElementById('resultsContainer').innerHTML = '<div class="empty-state"><div class="icon">&#128269;</div><p>Enter a search term to find posts and pages</p></div>';
                
            } catch (e) {
                console.error('Error loading database:', e);
                document.getElementById('resultsContainer').innerHTML = '<div class="empty-state"><div class="icon">&#9888;</div><p>Failed to load database: ' + e.message + '</p></div>';
            }
        }
        
        async function loadAllPosts() {
            const years = Object.keys(database._shards).sort().reverse();
            allPosts = [];
            
            for (const year of years) {
                const posts = await LiCAdmin.fetchPostsByYear(year);
                allPosts.push(...posts);
            }
            
            if (database.pages && database.pages.length > 0) {
                allPosts.push(...database.pages.map(function(p) { 
                    return Object.assign({}, p, { type: 'page' }); 
                }));
            }
            
            console.log('Loaded ' + allPosts.length + ' items for search');
        }
        
        function displayTopCategories(categories) {
            const sorted = categories.slice().sort(function(a, b) { return (b.count || 0) - (a.count || 0); });
            const top = sorted.slice(0, 8);
            
            const ul = document.getElementById('topCategories');
            ul.innerHTML = top.map(function(cat) {
                return '<li><a href="javascript:searchCategory(\'' + cat.slug + '\')">' + 
                    '<span>' + LiCAdmin.decodeEntities(cat.name) + '</span>' +
                    '<span class="count">' + (cat.count || 0) + '</span>' +
                    '</a></li>';
            }).join('');
        }
        
        function displayTopTags(tags) {
            const sorted = tags.slice().sort(function(a, b) { return (b.count || 0) - (a.count || 0); });
            const top = sorted.slice(0, 10);
            
            const ul = document.getElementById('topTags');
            ul.innerHTML = top.map(function(tag) {
                return '<li><a href="javascript:searchTag(\'' + tag.slug + '\')">' + 
                    '<span>' + LiCAdmin.decodeEntities(tag.name) + '</span>' +
                    '<span class="count">' + (tag.count || 0) + '</span>' +
                    '</a></li>';
            }).join('');
        }
        
        function searchCategory(slug) {
            document.getElementById('filterCategory').value = slug;
            document.getElementById('searchInput').value = '';
            performSearch();
        }
        
        function searchTag(slug) {
            document.getElementById('searchInput').value = 'tag:' + slug;
            performSearch();
        }
        
        function performSearch() {
            if (!isLoaded) return;
            
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const typeFilter = document.getElementById('filterType').value;
            const categoryFilter = document.getElementById('filterCategory').value;
            const yearFilter = document.getElementById('filterYear').value;
            const sortBy = document.getElementById('sortBy').value;
            
            currentPage = 1;
            
            filteredResults = allPosts.filter(function(post) {
                if (typeFilter && post.type !== typeFilter) return false;
                
                if (categoryFilter) {
                    const postCats = (post.categories || []).map(function(c) { return c.slug; });
                    if (postCats.indexOf(categoryFilter) === -1) return false;
                }
                
                if (yearFilter && post.date_published) {
                    const postYear = post.date_published.substring(0, 4);
                    if (postYear !== yearFilter) return false;
                }
                
                if (query) {
                    if (query.indexOf('tag:') === 0) {
                        const tagSlug = query.substring(4);
                        const postTags = (post.tags || []).map(function(t) { return t.slug; });
                        return postTags.indexOf(tagSlug) !== -1;
                    }
                    
                    const searchFields = [
                        post.title || '',
                        post.content_filtered || '',
                        post.excerpt || '',
                        (post.categories || []).map(function(c) { return c.name; }).join(' '),
                        (post.tags || []).map(function(t) { return t.name; }).join(' ')
                    ].join(' ').toLowerCase();
                    
                    const words = query.split(/\s+/).filter(function(w) { return w.length > 1; });
                    const allWordsMatch = words.every(function(word) { return searchFields.indexOf(word) !== -1; });
                    if (!allWordsMatch) return false;
                    
                    post._relevance = words.reduce(function(score, word) {
                        if ((post.title || '').toLowerCase().indexOf(word) !== -1) score += 10;
                        if ((post.excerpt || '').toLowerCase().indexOf(word) !== -1) score += 5;
                        return score;
                    }, 0);
                }
                
                return true;
            });
            
            switch (sortBy) {
                case 'relevance':
                    if (query) {
                        filteredResults.sort(function(a, b) { return (b._relevance || 0) - (a._relevance || 0); });
                    } else {
                        filteredResults.sort(function(a, b) { return (b.date_published || '').localeCompare(a.date_published || ''); });
                    }
                    break;
                case 'date-desc':
                    filteredResults.sort(function(a, b) { return (b.date_published || '').localeCompare(a.date_published || ''); });
                    break;
                case 'date-asc':
                    filteredResults.sort(function(a, b) { return (a.date_published || '').localeCompare(b.date_published || ''); });
                    break;
                case 'title':
                    filteredResults.sort(function(a, b) { return (a.title || '').localeCompare(b.title || ''); });
                    break;
            }
            
            displayResults();
        }
        
        function displayResults() {
            const container = document.getElementById('resultsContainer');
            const countEl = document.getElementById('resultsCount');
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (filteredResults.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">&#128533;</div><p>No results found. Try different search terms or filters.</p></div>';
                countEl.textContent = '';
                document.getElementById('pagination').style.display = 'none';
                return;
            }
            
            const totalPages = Math.ceil(filteredResults.length / resultsPerPage);
            const startIndex = (currentPage - 1) * resultsPerPage;
            const endIndex = Math.min(startIndex + resultsPerPage, filteredResults.length);
            const pageResults = filteredResults.slice(startIndex, endIndex);
            
            countEl.innerHTML = 'Showing <strong>' + (startIndex + 1) + '&#8211;' + endIndex + '</strong> of <strong>' + filteredResults.length + '</strong> results';
            
            container.innerHTML = pageResults.map(function(post) {
                let excerpt = LiCAdmin.decodeEntities(post.excerpt || (post.content_filtered || '').substring(0, 200));
                if (excerpt.length >= 200) excerpt += '...';
                
                if (query && query.indexOf('tag:') !== 0) {
                    const words = query.split(/\s+/).filter(function(w) { return w.length > 1; });
                    words.forEach(function(word) {
                        const regex = new RegExp('(' + escapeRegex(word) + ')', 'gi');
                        excerpt = excerpt.replace(regex, '<mark>$1</mark>');
                    });
                }
                
                const categories = (post.categories || []).map(function(c) {
                    return '<a href="javascript:searchCategory(\'' + c.slug + '\')" class="tag category">' + LiCAdmin.decodeEntities(c.name) + '</a>';
                }).join('');
                
                const tags = (post.tags || []).slice(0, 5).map(function(t) {
                    return '<a href="javascript:searchTag(\'' + t.slug + '\')" class="tag">' + LiCAdmin.decodeEntities(t.name) + '</a>';
                }).join('');
                
                const title = LiCAdmin.decodeEntities(post.title || 'Untitled');
                
                return '<div class="result-item">' +
                    '<div class="result-title"><a href="' + post.url + '">' + title + '</a></div>' +
                    '<div class="result-meta">' +
                        '<span>' + LiCAdmin.formatDate(post.date_published) + '</span>' +
                        '<span>' + (post.type || 'post') + '</span>' +
                        (post.word_count ? '<span>' + post.word_count + ' words</span>' : '') +
                    '</div>' +
                    '<div class="result-excerpt">' + excerpt + '</div>' +
                    (categories || tags ? '<div class="result-tags">' + categories + tags + '</div>' : '') +
                '</div>';
            }).join('');
            
            renderPagination(totalPages);
        }
        
        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'flex';
            
            let html = '';
            
            html += '<button onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>&#8592; Prev</button>';
            
            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            
            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }
            
            if (startPage > 1) {
                html += '<button onclick="goToPage(1)">1</button>';
                if (startPage > 2) html += '<button disabled>...</button>';
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += '<button onclick="goToPage(' + i + ')" class="' + (i === currentPage ? 'active' : '') + '">' + i + '</button>';
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<button disabled>...</button>';
                html += '<button onclick="goToPage(' + totalPages + ')">' + totalPages + '</button>';
            }
            
            html += '<button onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>Next &#8594;</button>';
            
            container.innerHTML = html;
        }
        
        function goToPage(page) {
            currentPage = page;
            displayResults();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
    </script>
</body>
