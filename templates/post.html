<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} – Learning is Change</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{abs_url}}">
<link rel="alternate" type="text/markdown" href="{{abs_url}}index.md" title="Markdown">
<link rel="alternate" type="application/rss+xml" title="Learning is Change" href="/feed/">
<link rel="alternate" type="application/rss+xml" title="The Learning is Change Podcast" href="/feed/podcast/">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Learning is Change">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{abs_url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:locale" content="en_US">
<meta property="article:published_time" content="{{date_iso}}">
<meta property="article:author" content="https://learningischange.com/portfolio/about/">
<meta name="twitter:card" content="summary">
{{head_common}}
<script type="application/ld+json">{{json_ld}}</script>
</head>
<body class="post-page {{body_classes}}">
<!-- LIC:NAV:START -->
{{nav}}
<!-- LIC:NAV:END -->

<main class="page-container"><div class="blog-layout">
<article id="post-{{post_id}}" class="post">
  <header class="post-header">
    <div class="kicker">{{categories}}</div>
    <h1>{{title}}</h1>
    <div class="post-meta">
      <time datetime="{{date_iso}}">{{date_formatted}}</time>
      <span>{{word_count}} words · {{reading_time}} min read</span>
      <span>by <a href="/portfolio/about/">Ben Wilkoff</a></span>
    </div>
  </header>
  <!-- LIC:CONTENT:START -->
  <div class="prose">{{content}}</div>
  <!-- LIC:CONTENT:END -->
  <footer class="post-footer">
    <div class="tag-list">{{tags}}</div>
    {{comments}}{{bluesky}}
    <nav class="post-nav" aria-label="Neighboring posts">{{prev_link}}{{next_link}}</nav>
    {{related}}
  </footer>
</article>
<!-- LIC:RAIL:START -->
{{rail}}
<!-- LIC:RAIL:END -->
</div></main>

<!-- LIC:FOOTER:START -->
{{footer}}
<!-- LIC:FOOTER:END -->
</body>
</html>
