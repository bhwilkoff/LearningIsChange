name: Update RSS Feeds

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: 'Full URL of the post that was edited/created'
        required: true
        type: string
      post_year:
        description: 'Year of the post (for database lookup)'
        required: true
        type: string

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update RSS feeds
        run: |
          cat > update-rss.js << 'SCRIPT_EOF'
          const fs = require('fs');
          
          const postUrl = process.env.POST_URL;
          const postYear = process.env.POST_YEAR;
          
          console.log(`Looking for post: ${postUrl}`);
          console.log(`Year: ${postYear}`);
          
          // Load post data from database
          const dbPath = `database/posts/${postYear}.json`;
          if (!fs.existsSync(dbPath)) {
            console.log(`Database file not found: ${dbPath}`);
            process.exit(0);
          }
          
          const dbContent = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
          const posts = dbContent.posts || [];
          
          // Find the post by URL
          const post = posts.find(p => {
            const pUrl = (p.url || p.guid || '').replace(/\/$/, '');
            const searchUrl = postUrl.replace(/\/$/, '');
            return pUrl === searchUrl;
          });
          
          if (!post) {
            console.log(`Post not found in database: ${postUrl}`);
            process.exit(0);
          }
          
          console.log(`Found post: ${post.title}`);
          
          const postTitle = post.title || '';
          const postContent = post.content || '';
          const postExcerpt = post.excerpt || postContent.replace(/<[^>]+>/g, '').substring(0, 200) + '...';
          
          function escapeXml(str) {
            if (!str) return '';
            return str
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
          }
          
          function updateRssFile(feedPath, includeFullContent) {
            if (!fs.existsSync(feedPath)) {
              console.log(`Feed file not found: ${feedPath}`);
              return false;
            }
            
            console.log(`Processing: ${feedPath}`);
            let rssContent = fs.readFileSync(feedPath, 'utf8');
            
            // Check if post exists in feed
            if (!rssContent.includes(postUrl)) {
              console.log(`Post not found in ${feedPath}`);
              return false;
            }
            
            // Find and update the item block containing this post's URL
            const itemRegex = /<item>[\s\S]*?<\/item>/g;
            let updated = false;
            
            rssContent = rssContent.replace(itemRegex, (itemBlock) => {
              if (itemBlock.includes(postUrl)) {
                updated = true;
                console.log(`Updating item in ${feedPath}`);
                
                // Update title
                itemBlock = itemBlock.replace(
                  /<title>.*?<\/title>/,
                  `<title>${escapeXml(postTitle)}</title>`
                );
                
                // Update description
                if (includeFullContent) {
                  itemBlock = itemBlock.replace(
                    /<description>[\s\S]*?<\/description>/,
                    `<description><![CDATA[${postContent}]]></description>`
                  );
                } else {
                  itemBlock = itemBlock.replace(
                    /<description>[\s\S]*?<\/description>/,
                    `<description><![CDATA[${postExcerpt}]]></description>`
                  );
                }
                
                // Update content:encoded if present
                if (itemBlock.includes('<content:encoded>')) {
                  itemBlock = itemBlock.replace(
                    /<content:encoded>[\s\S]*?<\/content:encoded>/,
                    `<content:encoded><![CDATA[${postContent}]]></content:encoded>`
                  );
                }
              }
              return itemBlock;
            });
            
            if (updated) {
              // Update lastBuildDate
              const now = new Date().toUTCString();
              rssContent = rssContent.replace(
                /<lastBuildDate>.*?<\/lastBuildDate>/,
                `<lastBuildDate>${now}</lastBuildDate>`
              );
              
              fs.writeFileSync(feedPath, rssContent, 'utf8');
              console.log(`Updated: ${feedPath}`);
              return true;
            }
            
            return false;
          }
          
          // Update full.xml (full content archive)
          const fullUpdated = updateRssFile('feed/full.xml', true);
          
          // Update index.xml (excerpts only) - optional, may not contain old posts
          const indexUpdated = updateRssFile('feed/index.xml', false);
          
          if (fullUpdated || indexUpdated) {
            console.log('RSS feeds updated successfully');
          } else {
            console.log('No RSS feeds were updated');
          }
          SCRIPT_EOF
          
          POST_URL="${{ inputs.post_url }}" \
          POST_YEAR="${{ inputs.post_year }}" \
          node update-rss.js
          
          rm update-rss.js

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add feed/full.xml feed/index.xml 2>/dev/null || true
            git commit -m "Update RSS feeds via workflow"
            git push
            echo "RSS feeds updated and pushed"
          fi
